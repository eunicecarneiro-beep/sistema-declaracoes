
name: Verificacao diaria do Supabase

on:
  schedule:
    - cron: "17 7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Consultar funcao de verificacao
        env:
          SUPABASE_URL: https://cujlebxqqposqomtfvdk.supabase.co
          SUPABASE_KEY: sb_publishable_qgZR9bAPNGjYoG-2i_Z5Jg_1Rg3UzBx

        shell: bash
        run: |
          set -euo pipefail

          echo "Iniciando verificacao do Supabase..."

          status=$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Accept: application/json") || {
              echo "Erro de conexao com o Supabase."
              exit 1
            }

          echo "Resposta HTTP: $status"

          if [ "$status" = "200" ]; then
            echo "Supabase respondeu normalmente."
            echo "Verificacao concluida com sucesso."
          else
            echo "Falha na verificacao. HTTP: $status"
            exit 1
          fi
