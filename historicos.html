<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Históricos Escolares — Eunice Carneiro</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hist-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
    .hist-stat,.hist-panel{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:18px}
    .hist-stat strong{display:block;font-size:26px;margin:6px 0}
    .hist-stat small{color:#667085}
    .hist-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
    .hist-tabs button{padding:12px;border:1px solid #d6dce7;border-radius:9px;background:white;color:#344054;font-weight:600}
    .hist-tabs button.on{background:#173b73;color:white}
    .hist-section{display:none}.hist-section.on{display:block}
    .hist-toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:15px}
    .hist-field{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1}
    .hist-field label{font-weight:600;font-size:12px;color:#344054}
    .hist-field input,.hist-field select,.hist-field textarea{border:1px solid #cdd5df;border-radius:8px;padding:10px;background:white;width:100%}
    .hist-field textarea{min-height:70px}
    .hist-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
    .hist-table{overflow:auto;max-height:60vh;border:1px solid #e4e7ec;border-radius:10px}
    .hist-table table{min-width:900px}.hist-table th{position:sticky;top:0}
    .hist-muted{color:#667085;font-size:13px}.hist-alert{background:#fff7ed;color:#934400;padding:12px 14px;border-radius:9px;margin:12px 0}
    .hist-success{background:#ecfdf3;color:#067647;padding:12px 14px;border-radius:9px;margin:12px 0}
    .hist-error{background:#fef3f2;color:#b42318;padding:12px 14px;border-radius:9px;margin:12px 0}
    .hist-tag{padding:4px 8px;border-radius:20px;font-size:11px;background:#eef4ff;color:#1b4fa0;display:inline-block}
    .hist-actions{display:flex;gap:8px;flex-wrap:wrap}.hist-note{white-space:pre-wrap}
    .hist-check{display:flex;gap:9px;align-items:start;margin:12px 0}
    #hist-status{position:sticky;bottom:10px;z-index:20}
    @media(max-width:900px){.hist-grid{grid-template-columns:repeat(2,1fr)}.hist-form{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:580px){.hist-grid,.hist-form{grid-template-columns:1fr}}
  </style>
</head>
<body data-page="historicos">
  <div id="app"></div>
  <script src="js/app.js?v=20261008"></script>
  <!-- Bibliotecas fixadas em versões específicas. Antes do uso em produção, hospede cópias locais verificadas. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/historicos.js?v=1"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>HistoricosPage.init());</script>
</body>
</html>
